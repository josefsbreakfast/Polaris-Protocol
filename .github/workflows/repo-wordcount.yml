name: Repo Word Count (Gap Finder)

on:
  workflow_dispatch: {}
  push:
    paths:
      - "**/*.md"
      - "**/*.markdown"
      - "**/*.mdx"
      - "**/*.txt"
      - ".github/workflows/repo-wordcount.yml"

permissions:
  contents: read

env:
  MIN_FILE_WORDS: "500"
  MIN_FOLDER_WORDS: "5000"
  MAX_ROWS_IN_SUMMARY: "20"

  # Excluded from file and folder gap reports.
  # These paths remain included in repository totals.
  GAPS_IGNORE_PATHS: "🏮_Admin_Nest,Disruption_Kit/Field_Logs"

jobs:
  count:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Count words and find gaps
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import os
          import re
          from pathlib import Path

          # --------------------------------------------------
          # SETTINGS
          # --------------------------------------------------

          ROOT = Path(".")

          MIN_FILE = int(os.getenv("MIN_FILE_WORDS", "500"))
          MIN_FOLDER = int(os.getenv("MIN_FOLDER_WORDS", "5000"))
          MAX_ROWS = int(os.getenv("MAX_ROWS_IN_SUMMARY", "20"))

          IGNORE_RAW = os.getenv("GAPS_IGNORE_PATHS", "")


          def normalise_path(path: str) -> str:
              """
              Convert a path to a clean, repository-relative POSIX path.
              """
              path = path.replace("\\", "/").strip()

              while path.startswith("./"):
                  path = path[2:]

              return path.strip("/")


          IGNORE_PREFIXES = [
              normalise_path(path).casefold()
              for path in IGNORE_RAW.split(",")
              if normalise_path(path)
          ]


          def is_ignored(path: str) -> bool:
              """
              Match an ignored path exactly, or anything beneath it.
              Matching is case-insensitive.
              """
              normalised = normalise_path(path).casefold()

              return any(
                  normalised == prefix
                  or normalised.startswith(prefix + "/")
                  for prefix in IGNORE_PREFIXES
              )


          # --------------------------------------------------
          # COLLECT FILES
          # --------------------------------------------------

          SKIP_NAMES = {
              ".git",
              ".github",
              ".venv",
              "venv",
              "node_modules",
              "dist",
              "build",
              "_site",
              "artifacts",
          }

          PROSE_EXTENSIONS = {
              ".md",
              ".markdown",
              ".mdx",
              ".txt",
          }

          files = []

          for base, dirs, filenames in os.walk(ROOT):
              dirs[:] = [
                  directory
                  for directory in dirs
                  if directory not in SKIP_NAMES
                  and not directory.startswith(".")
              ]

              for filename in filenames:
                  path = Path(base) / filename

                  if path.suffix.casefold() in PROSE_EXTENSIONS:
                      files.append(path)


          # --------------------------------------------------
          # HARSH PROSE-ONLY WORD COUNT
          # --------------------------------------------------

          frontmatter_re = re.compile(
              r"\A---\s*\n.*?\n---\s*(?:\n|\Z)",
              re.DOTALL,
          )

          fenced_code_re = re.compile(
              r"```.*?```|~~~.*?~~~",
              re.DOTALL,
          )

          inline_code_re = re.compile(
              r"`[^`\n]*`"
          )

          markdown_image_re = re.compile(
              r"!$begin:math:display$\[\^$end:math:display$]*\]$begin:math:text$\[\^\)\\n\]\*$end:math:text$"
          )

          markdown_link_re = re.compile(
              r"$begin:math:display$\(\[\^$end:math:display$]+)\]$begin:math:text$\[\^\)\\n\]\*$end:math:text$"
          )

          html_re = re.compile(
              r"<[^>]+>"
          )

          bare_url_re = re.compile(
              r"https?://\S+|www\.\S+",
              re.IGNORECASE,
          )

          whitespace_re = re.compile(
              r"\s+"
          )


          def count_words(path: Path) -> int:
              try:
                  text = path.read_text(
                      encoding="utf-8",
                      errors="replace",
                  )
              except OSError as exc:
                  print(f"Warning: could not read {path}: {exc}")
                  return 0

              text = frontmatter_re.sub("", text, count=1)
              text = fenced_code_re.sub(" ", text)
              text = inline_code_re.sub(" ", text)
              text = markdown_image_re.sub(" ", text)
              text = markdown_link_re.sub(r"\1", text)
              text = html_re.sub(" ", text)
              text = bare_url_re.sub(" ", text)
              text = whitespace_re.sub(" ", text).strip()

              return len(text.split()) if text else 0


          # --------------------------------------------------
          # FILE COUNTS
          # --------------------------------------------------

          rows = []
          total = 0

          for path in sorted(
              files,
              key=lambda item: item.as_posix().casefold(),
          ):
              word_count = count_words(path)

              relative_path = normalise_path(
                  os.path.relpath(path, ROOT)
              )

              rows.append((relative_path, word_count))
              total += word_count


          # --------------------------------------------------
          # TOP-LEVEL FOLDER AGGREGATION
          # --------------------------------------------------

          def top_folder(path: str) -> str:
              normalised = normalise_path(path)
              parts = normalised.split("/")

              if len(parts) <= 1:
                  return "[repository root]"

              return parts[0]


          by_folder = {}

          for path, word_count in rows:
              folder = top_folder(path)
              by_folder[folder] = (
                  by_folder.get(folder, 0) + word_count
              )

          folder_rows = sorted(
              by_folder.items(),
              key=lambda item: (
                  -item[1],
                  item[0].casefold(),
              ),
          )


          # --------------------------------------------------
          # GAP REPORTS
          # --------------------------------------------------

          thin_files = [
              (path, word_count)
              for path, word_count in rows
              if word_count < MIN_FILE
              and not is_ignored(path)
          ]

          thin_files.sort(
              key=lambda item: (
                  item[1],
                  item[0].casefold(),
              )
          )


          def folder_is_ignored(folder: str) -> bool:
              if folder == "[repository root]":
                  return False

              return is_ignored(folder)


          gap_folder_rows = [
              (folder, word_count)
              for folder, word_count in folder_rows
              if not folder_is_ignored(folder)
          ]

          thin_folders = [
              (folder, word_count)
              for folder, word_count in gap_folder_rows
              if word_count < MIN_FOLDER
          ]

          thin_folders.sort(
              key=lambda item: (
                  item[1],
                  item[0].casefold(),
              )
          )


          # --------------------------------------------------
          # WRITE CSV ARTIFACTS
          # --------------------------------------------------

          artifact_dir = Path("artifacts")
          artifact_dir.mkdir(
              parents=True,
              exist_ok=True,
          )

          with (artifact_dir / "wordcount.csv").open(
              "w",
              newline="",
              encoding="utf-8",
          ) as output:
              writer = csv.writer(output)
              writer.writerow(["file", "words"])
              writer.writerows(rows)
              writer.writerow(["TOTAL", total])

          with (artifact_dir / "by_folder.csv").open(
              "w",
              newline="",
              encoding="utf-8",
          ) as output:
              writer = csv.writer(output)
              writer.writerow(["folder", "words"])
              writer.writerows(folder_rows)

          with (artifact_dir / "thin_files.csv").open(
              "w",
              newline="",
              encoding="utf-8",
          ) as output:
              writer = csv.writer(output)
              writer.writerow([
                  "file",
                  "words",
                  "threshold",
              ])

              for path, word_count in thin_files:
                  writer.writerow([
                      path,
                      word_count,
                      MIN_FILE,
                  ])

          with (artifact_dir / "thin_folders.csv").open(
              "w",
              newline="",
              encoding="utf-8",
          ) as output:
              writer = csv.writer(output)
              writer.writerow([
                  "folder",
                  "words",
                  "threshold",
              ])

              for folder, word_count in thin_folders:
                  writer.writerow([
                      folder,
                      word_count,
                      MIN_FOLDER,
                  ])


          # --------------------------------------------------
          # GITHUB SUMMARY
          # --------------------------------------------------

          def escape_markdown_cell(value) -> str:
              return (
                  str(value)
                  .replace("\\", "\\\\")
                  .replace("|", "\\|")
                  .replace("\n", " ")
              )


          def markdown_table(headers, table_rows) -> str:
              if not table_rows:
                  return "*None*"

              header_line = (
                  "| "
                  + " | ".join(
                      escape_markdown_cell(header)
                      for header in headers
                  )
                  + " |"
              )

              separator_line = (
                  "| "
                  + " | ".join(
                      "---"
                      for _ in headers
                  )
                  + " |"
              )

              body_lines = [
                  "| "
                  + " | ".join(
                      escape_markdown_cell(value)
                      for value in row
                  )
                  + " |"
                  for row in table_rows
              ]

              return "\n".join([
                  header_line,
                  separator_line,
                  *body_lines,
              ])


          ignored_display = IGNORE_RAW or "—"

          summary = [
              "# Repo Word Count — Gap Finder",
              "",
              (
                  "**Total words (harsh prose-only): "
                  f"{total:,}**"
              ),
              "",
              f"- Files counted: {len(rows):,}",
              (
                  "- Thin file threshold: "
                  f"< {MIN_FILE:,} words"
              ),
              (
                  "- Thin folder threshold: "
                  f"< {MIN_FOLDER:,} words"
              ),
              (
                  "- Ignored in file and folder gap reports "
                  "(still included in totals): "
                  f"{ignored_display}"
              ),
              "",
          ]

          top_folders = folder_rows[:MAX_ROWS]

          summary.extend([
              "## Top folders by words",
              "",
              markdown_table(
                  ["Folder", "Words"],
                  [
                      (
                          folder,
                          f"{word_count:,}",
                      )
                      for folder, word_count
                      in top_folders
                  ],
              ),
              "",
          ])

          thinnest_folders = sorted(
              gap_folder_rows,
              key=lambda item: (
                  item[1],
                  item[0].casefold(),
              ),
          )[:MAX_ROWS]

          summary.extend([
              "## Thinnest folders",
              "",
              markdown_table(
                  ["Folder", "Words"],
                  [
                      (
                          folder,
                          f"{word_count:,}",
                      )
                      for folder, word_count
                      in thinnest_folders
                  ],
              ),
              "",
          ])

          thinnest_files = thin_files[:MAX_ROWS]

          summary.extend([
              "## Thinnest files",
              "",
              markdown_table(
                  ["File", "Words"],
                  [
                      (
                          path,
                          f"{word_count:,}",
                      )
                      for path, word_count
                      in thinnest_files
                  ],
              ),
              "",
              "## Gap totals",
              "",
              (
                  "- Files below threshold: "
                  f"{len(thin_files):,}"
              ),
              (
                  "- Folders below threshold: "
                  f"{len(thin_folders):,}"
              ),
              "",
          ])

          summary_path = os.environ.get(
              "GITHUB_STEP_SUMMARY"
          )

          if not summary_path:
              raise RuntimeError(
                  "GITHUB_STEP_SUMMARY is unavailable."
              )

          with open(
              summary_path,
              "a",
              encoding="utf-8",
          ) as output:
              output.write("\n".join(summary))

          print(f"Counted {len(rows):,} files.")
          print(f"Total words: {total:,}")
          print(f"Thin files: {len(thin_files):,}")
          print(f"Thin folders: {len(thin_folders):,}")
          PY

      - name: Upload CSV artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wordcount-gap-finder
          path: artifacts/
          if-no-files-found: error
